<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北海道教練排班系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
    }
    .title { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #64748b; margin-bottom: 24px; }
    #code {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      color: #0f172a;
      -webkit-text-security: disc;
      outline: none;
    }
    #code:focus { border-color: #2563eb; background: #fff; }
    #enter-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #enter-btn:active { background: #1d4ed8; }
    #error { min-height: 20px; margin-top: 10px; color: #e11d48; font-size: 14px; }
    #redirect-notice { display: none; color: #64748b; font-size: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <div id="redirect-notice">正在進入班表…</div>

    <div id="menu">
      <div class="title">北海道26-27</div>
      <div class="subtitle">請輸入 6 位數登入代碼</div>

      <form id="login-form" autocomplete="off">
        <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="••••••">
        <button id="enter-btn" type="submit">進入班表</button>
        <div id="error"></div>
      </form>
    </div>
  </div>

  <script>
    // 你的 GAS 正式部署網址
    var gasBaseUrl = "https://script.google.com/macros/s/AKfycbysGzFLJKJL7LJYbd2Ab1MqE3V0lpKrUBS78QTyZVqVnSKMq-Lp-_6FAfxuqCGHxolgZg/exec";
    var STORAGE_KEY = "hokkaidoCoachKey";

    function readKey() {
      try { return localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return ""; }
    }
    function saveKey(k) {
      try { localStorage.setItem(STORAGE_KEY, k); } catch (e) {}
    }
    function clearKey() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }

    function go(key) {
      document.getElementById("menu").style.display = "none";
      document.getElementById("redirect-notice").style.display = "block";
      window.location.replace(gasBaseUrl + "?key=" + encodeURIComponent(key));
    }

    (function init() {
      var params = new URLSearchParams(window.location.search);

      // 登出（或代碼無效被後端送回來）：清除記憶並回到輸入畫面
      if (params.get("logout") === "1") {
        clearKey();
        if (window.history && history.replaceState) {
          history.replaceState(null, "", window.location.pathname);
        }
        return;
      }

      // 已記住代碼：直接進入
      var saved = readKey();
      if (/^\d{6}$/.test(saved)) {
        go(saved);
      }
    })();

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var code = document.getElementById("code").value.trim();
      var err = document.getElementById("error");
      if (!/^\d{6}$/.test(code)) {
        err.textContent = "請輸入 6 位數字";
        return;
      }
      err.textContent = "";
      saveKey(code);
      go(code);
    });
  </script>

</body>
</html>
